name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Type-check (tsc --noEmit, all workspaces)
        run: npm run typecheck

      - name: Unit tests (node:test, all workspaces)
        run: npm test

      - name: End-to-end demo smoke run
        run: npm run demo
