name: android-apk

# Builds a standalone, debug-signed APK you can sideload onto a phone for
# testing — no Android Studio, no Metro. It is NOT a Play Store build (that
# needs the real upload key + an .aab; see docs/RELEASE.md).

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Target ABI(s). Include armeabi-v7a for budget 32-bit ROMs."
        type: choice
        default: "arm64-v8a,armeabi-v7a"
        options: ["arm64-v8a,armeabi-v7a", arm64-v8a, "arm64-v8a,armeabi-v7a,x86_64"]
      minimal:
        description: "Bare RN diagnostic APK — drop quick-crypto/mmkv/keychain, show a device-info screen"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache ~/.npm and ~/.gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-apk-${{ hashFiles('apps/mobile/package.json', 'apps/mobile/android/**/*.gradle') }}
          restore-keys: android-apk-

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Minimal mode — strip native deps, swap the entry file
        if: ${{ inputs.minimal }}
        run: |
          node -e "const p=require('./package.json'); for (const d of ['react-native-mmkv','react-native-quick-crypto','react-native-keychain']) delete p.dependencies[d]; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2));"
          cp index.diagnostic.js index.js
          echo "minimal build: entry=index.diagnostic.js, native deps removed"

      - name: Install JS dependencies
        run: npm install

      - name: Generate the Gradle wrapper
        working-directory: apps/mobile/android
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      # Cache the keystore so every build is signed with the SAME key — otherwise
      # Android refuses to install a new APK over the previous one.
      - name: Restore debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: apps/mobile/android/app/debug.keystore
          key: awakeos-debug-keystore-v1

      - name: Create debug keystore (first run only)
        if: steps.keystore.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android/app
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK (unshrunk, JS bundled, debug-signed)
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease \
            -PAWAKE_DISABLE_MINIFY=1 \
            -PreactNativeArchitectures=${{ github.event.inputs.abi || 'arm64-v8a' }} \
            --no-daemon --stacktrace

      - name: Rename APK
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          ls -lh
          cp app-release.apk "awakeos-${GITHUB_SHA::7}.apk"
          ls -lh awakeos-*.apk

      - name: Inspect the APK
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "== badging =="
          "$BT/aapt2" dump badging app-release.apk | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code|application-label:" || true
          echo "== native libs =="
          unzip -l app-release.apk | grep -E "lib/.*\.so" | awk '{print $4}' | sed 's#/[^/]*$##' | sort -u || echo "(no lib/*.so)"
          echo "== signature =="
          "$BT/apksigner" verify --verbose --print-certs app-release.apk 2>&1 | grep -E "Verified using|Signer #1 certificate DN|number of signers" || true

      - uses: actions/upload-artifact@v4
        with:
          name: awakeos-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/awakeos-*.apk
          retention-days: 14
          if-no-files-found: error
