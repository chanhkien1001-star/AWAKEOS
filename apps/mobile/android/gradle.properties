org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.configureondemand=true

android.useAndroidX=true

# ABIs to build (CI overrides with -PreactNativeArchitectures=arm64-v8a).
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Old architecture — matches the hand-written Event Collector native module
# (ReactContextBaseJavaModule + ReactPackage).
newArchEnabled=false
hermesEnabled=true

# Release signing (do NOT commit real values — pass via ~/.gradle/gradle.properties
# or CI env, see docs/RELEASE.md).
# AWAKE_UPLOAD_STORE_FILE=awake-upload.jks
# AWAKE_UPLOAD_KEY_ALIAS=awake-upload
# AWAKE_UPLOAD_STORE_PASSWORD=
# AWAKE_UPLOAD_KEY_PASSWORD=
