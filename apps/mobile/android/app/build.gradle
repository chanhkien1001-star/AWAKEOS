apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

// -PreactNativeArchitectures=arm64-v8a builds a single, small APK.
def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.awakeos"

    splits {
        abi {
            reset()
            enable true
            universalApk false
            include(*reactNativeArchitectures())
        }
    }
    defaultConfig {
        applicationId "com.awakeos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('AWAKE_UPLOAD_STORE_FILE')) {
                storeFile file(AWAKE_UPLOAD_STORE_FILE)
                storePassword AWAKE_UPLOAD_STORE_PASSWORD
                keyAlias AWAKE_UPLOAD_KEY_ALIAS
                keyPassword AWAKE_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig project.hasProperty('AWAKE_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            // -PAWAKE_DISABLE_MINIFY=1 for a fast, un-shrunk test APK (CI).
            minifyEnabled project.hasProperty('AWAKE_DISABLE_MINIFY') ? false : enableProguardInReleaseBuilds
            shrinkResources project.hasProperty('AWAKE_DISABLE_MINIFY') ? false : enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Event Collector native module deps
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
